media:
  - name: images
    label: Site images
    input: public/images
    output: /images
    extensions: [jpg, jpeg, png, webp, avif, svg]
    rename: safe

content:
  - name: profile
    label: 个人资料
    type: file
    path: data/profile.json
    format: json
    fields:
      - { name: nameZh, label: 中文姓名, type: string, required: true }
      - { name: nameEn, label: 英文姓名 / 网站署名, type: string, required: true }
      - {
          name: avatar,
          label: 头像,
          type: image,
          options: { media: images, path: public/images/avatar },
        }
      - { name: bio, label: 一句话简介, type: text }
      - { name: heroTitle, label: 首页主标题（换行分隔两行）, type: text }
      - { name: heroSubtitle, label: 首页副标题, type: string }
      - { name: introduction, label: 关于我简介, type: text }
      - { name: introductionZh, label: 中文介绍, type: text }
      - { name: introductionEn, label: 英文介绍, type: text }
      - { name: email, label: 公开邮箱（可留空）, type: string }
      - { name: github, label: GitHub URL（可留空）, type: string }
      - { name: skills, label: 技能, type: string, list: true }
      - { name: interests, label: 兴趣, type: string, list: true }
      - { name: focus, label: 关注领域（首页展示）, type: string, list: true }
      - { name: learning, label: 当前学习内容, type: string, list: true }
      - name: experiences
        label: 经历时间线（只填真实经历）
        type: object
        list: true
        fields:
          - { name: period, label: 时间, type: string }
          - { name: title, label: 经历标题, type: string }
          - { name: description, label: 描述, type: text }

  - name: posts
    label: 博客文章
    type: collection
    path: src/content/blog
    filename: '{primary}.md'
    format: yaml-frontmatter
    view:
      { primary: title, sort: date, order: desc, fields: [title, status, date, category, featured] }
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: description, label: 摘要 / SEO 描述, type: text, required: true }
      - { name: date, label: 发布时间, type: date, required: true }
      - { name: updated, label: 修改时间（可选）, type: date }
      - name: status
        label: 发布状态
        type: select
        options: { values: [draft, published, unlisted] }
        default: draft
      - { name: category, label: 分类, type: string, required: true }
      - { name: tags, label: 标签, type: string, list: true }
      - { name: featured, label: 首页精选, type: boolean, default: false }
      - {
          name: cover,
          label: 封面图片,
          type: image,
          options: { media: images, path: public/images/blog },
        }
      - { name: seoTitle, label: SEO 标题（可选）, type: string }
      - { name: seoDescription, label: SEO 描述（可选）, type: text }
      - {
          name: body,
          label: 正文,
          type: rich-text,
          options:
            { format: markdown, media: images, path: public/images/blog/body, switcher: true },
        }

  - name: knowledge
    label: 知识笔记
    type: collection
    path: src/content/knowledge
    filename: '{primary}.md'
    format: yaml-frontmatter
    view: { primary: title, sort: date, order: desc, fields: [title, status, category, maturity] }
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: description, label: 摘要, type: text, required: true }
      - { name: date, label: 创建日期, type: date, required: true }
      - { name: updated, label: 修改日期, type: date }
      - name: status
        label: 发布状态
        type: select
        options: { values: [draft, published, unlisted] }
        default: draft
      - name: category
        label: 分类
        type: string
        description: '可输入新分类；网站设置中可维护分类导航。'
      - { name: tags, label: 标签, type: string, list: true }
      - name: maturity
        label: 知识成熟度
        type: select
        options: { values: [Seedling, Growing, Evergreen] }
        default: Seedling
      - { name: featured, label: 首页精选, type: boolean, default: false }
      - {
          name: cover,
          label: 封面图片,
          type: image,
          options: { media: images, path: public/images/knowledge },
        }
      - { name: seoTitle, label: SEO 标题, type: string }
      - { name: seoDescription, label: SEO 描述, type: text }
      - {
          name: body,
          label: 正文,
          type: rich-text,
          options:
            { format: markdown, media: images, path: public/images/knowledge/body, switcher: true },
        }

  - name: projects
    label: 项目作品
    type: collection
    path: src/content/projects
    filename: '{primary}.md'
    format: yaml-frontmatter
    view:
      {
        primary: title,
        sort: order,
        order: asc,
        fields: [title, projectStatus, status, featured, order],
      }
    fields:
      - { name: title, label: 项目名称, type: string, required: true }
      - { name: description, label: 项目简介, type: text, required: true }
      - { name: date, label: 日期（用于排序）, type: date, required: true }
      - name: status
        label: 网站发布状态
        type: select
        options: { values: [draft, published, unlisted] }
        default: draft
      - name: projectStatus
        label: 项目状态
        type: select
        options: { values: ['Planning', 'In Progress', 'Completed', 'Archived'] }
      - { name: category, label: 分类, type: string }
      - { name: tags, label: 标签, type: string, list: true }
      - { name: stack, label: 技术栈, type: string, list: true }
      - { name: featured, label: 首页精选, type: boolean, default: false }
      - { name: order, label: 排序（越小越靠前）, type: number, default: 0 }
      - {
          name: cover,
          label: 封面,
          type: image,
          options: { media: images, path: public/images/projects },
        }
      - {
          name: screenshots,
          label: 项目截图,
          type: image,
          list: true,
          options: { media: images, path: public/images/projects/screenshots },
        }
      - { name: github, label: GitHub 地址（可留空）, type: string }
      - { name: demo, label: 在线演示地址（可留空）, type: string }
      - { name: started, label: 开始日期, type: date }
      - { name: completed, label: 完成日期, type: date }
      - { name: seoTitle, label: SEO 标题, type: string }
      - { name: seoDescription, label: SEO 描述, type: text }
      - {
          name: body,
          label: 项目详情,
          type: rich-text,
          options:
            { format: markdown, media: images, path: public/images/projects/body, switcher: true },
        }

  - name: resources
    label: 资源书架
    type: file
    path: data/resources.json
    format: json
    list: true
    fields:
      - { name: name, label: 名称, type: string, required: true }
      - { name: description, label: 简介, type: text }
      - { name: url, label: 网站地址, type: string, required: true }
      - { name: icon, label: 图标文字或 /images/... 图片路径, type: string }
      - {
          name: iconImage,
          label: 上传 Logo（优先于文字图标）,
          type: image,
          options: { media: images, path: public/images/resources },
        }
      - { name: category, label: 分类, type: string }
      - { name: recommended, label: 推荐, type: boolean }

  - name: site
    label: 网站设置
    type: file
    path: data/site-config.json
    format: json
    fields:
      - { name: name, label: 网站名称, type: string }
      - { name: description, label: 网站默认描述, type: text }
      - {
          name: logo,
          label: Logo 图片（可留空）,
          type: image,
          options: { media: images, path: public/images/site },
        }
      - {
          name: favicon,
          label: 网站图标,
          type: image,
          options: { media: images, path: public/images/site },
        }
      - {
          name: defaultAvatar,
          label: 默认头像,
          type: image,
          options: { media: images, path: public/images/avatar },
        }
      - { name: seoTitle, label: 默认 SEO 标题, type: string }
      - {
          name: ogImage,
          label: 默认分享图片,
          type: image,
          options: { media: images, path: public/images/site },
        }
      - { name: language, label: 页面语言, type: string }
      - name: theme
        label: 默认主题
        type: select
        options: { values: [system, light, dark] }
      - { name: copyright, label: 页脚文字, type: string }
      - { name: knowledgeCategories, label: 知识分类, type: string, list: true }
      - { name: resourceCategories, label: 资源分类, type: string, list: true }

  - name: socials
    label: 社交链接
    type: file
    path: data/social-links.json
    format: json
    list: true
    fields:
      - { name: label, label: 显示名称, type: string }
      - { name: url, label: URL（仅支持 HTTP(S)）, type: string }

  - name: navigation
    label: 导航菜单
    type: file
    path: data/navigation.json
    format: json
    list: true
    fields:
      - { name: label, label: 显示名称, type: string }
      - { name: path, label: 站内路径，例如 /about/, type: string }
